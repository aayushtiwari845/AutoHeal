name: AutoHeal tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Run standard library test suite
        run: python -m unittest discover -s autoheal/tests -v
      - name: Verify JavaScript syntax
        run: node --check autoheal/web/app.js
